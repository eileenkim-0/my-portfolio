<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Eileenkim</title>

    <link rel="icon" href="assets/icons/terminal.svg">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/projects.css">
</head>
<body class="wide-layout">
    <div class="utility-toggle">
        <button id="toggle-lang" class="toggle-btn">Aa</button>
        <span class="toggle-divider">/</span>
        <button id="toggle-theme" class="toggle-btn">
            <img id="toggle-icon" src="assets/icons/moon.svg" alt="Dark Mode">
        </button>
    </div>
    <header class="profile-header">
        <img src="assets/images/profile-pic.png" class="avatar" alt="Eileen Kim">

        <div class="meta">
            <div class="meta-location">
                <img src="assets/icons/globe.svg" class="profile-header-icon" alt="">
                <span>Oslo, Norway</span>
            </div>

            <div class="meta-clock">
                <img src="assets/icons/clock.svg" class="profile-header-icon" alt="">
                <time id="oslo-time"></time>
            </div>
        </div>
    </header>
    
    <main>
        <section class="projects-intro">
            <p>Things I've built while exploring different technologies and ideas.</p>
        </section>

        <section class="filter-buttons">
            <button class="filter-btn active">App</button>
            <button class="filter-btn">Design</button>
            <button class="filter-btn">Case study</button>
        </section>

        <section class="project-list" id="project-list"></section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <img src="assets/icons/home.svg" alt="Home page">
        </a>

        <a href="projects.html" class="nav-item">
            <img src="assets/icons/folder-active.svg" alt="My projects">
        </a>

        <a href="explored.html" class="nav-item">
            <img src="assets/icons/search.svg" alt="Explored components">
        </a>

        <a href="about.html" class="nav-item">
            <img src="assets/icons/code.svg" alt="My technology languages">
        </a>

        <button class="nav-item" id="toggle-socials">
            <img src="assets/icons/chat.svg" alt="Socials">
        </button>
    </nav>

    <script src="script.js"></script>
    <script src="projects.js"></script>
</body>
</html>
